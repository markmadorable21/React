<!doctype html>
<html>
  <head>
    <title>Lesson 3 Exercises</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function DisplayTypedText({ current, setCurrent }) {
        function concatenate(event) {
          setCurrent(event.target.value);
        }
        function deleteInput() {
          setCurrent('');
        }

        function example() {
          setCurrent('Bayot');
        }
        return (
          <>
            <input onChange={concatenate} value={current} />
            <button onClick={deleteInput}>Reset</button>
            <button onClick={example}>Example</button>
            <p>Hello {current}</p>
          </>
        );
      }

      function App() {
        const [current, setCurrent] = React.useState('');

        return (
          <>
            <DisplayTypedText current={current} setCurrent={setCurrent} />
          </>
        );
      }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
