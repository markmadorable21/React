<!doctype html>
<html>
  <head>
    <title>Lesson 3 Exercises</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function Counter({ count, setCount }) {
        // do not use shortcut HAHAHA
        // const [count, setCount] = React.useState(0);

        // count is a current data
        // setCount is a function bitch

        function clickButton() {
          setCount(count + 1);
        }

        function clickedResetButton() {
          setCount(0);
        }
        function toggleAutoClickButton() {
          console.log('Clicked');
        }
        return (
          <>
            <button onClick={clickButton}>
              {count === 1 ? 'Clicked 1 time' : `Clicked ${count} times`}
            </button>
            <button onClick={clickedResetButton}>Reset</button>
            <button onClick={toggleAutoClickButton}>Auto Click</button>
          </>
        );
      }

      function App() {
        const result = React.useState(0);
        const count = result[0]; // 0
        const setCount = result[1]; // a function
        return (
          <>
            <Counter count={count} setCount={setCount} />
          </>
        );
      }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
