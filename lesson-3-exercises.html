<!doctype html>
<html>
  <head>
    <title>Lesson 3 Exercises</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function Counter({ count, setCount }) {
        // do not use shortcut HAHAHA
        // const [count, setCount] = React.useState(0);

        // count is a current data
        // setCount is a function bitch

        function clickButton() {
          setCount(count + 1);
        }

        if (count === 1) {
          return (
            <>
              <button onClick={clickButton}>Clicked {count} time</button>
            </>
          );
        }
        return (
          <>
            <button onClick={clickButton}>Clicked {count} times</button>
          </>
        );
      }

      function Reset({ count, setCount }) {
        function clickResetButton() {
          setCount(0);
        }
        return (
          <>
            <button onClick={clickResetButton}>Reset</button>
          </>
        );
      }

      function App() {
        const result = React.useState(0);
        const count = result[0]; // 0
        const setCount = result[1]; // a function
        return (
          <>
            <Counter count={count} setCount={setCount} />
            <Counter count={count} setCount={setCount} />
            <Reset count={count} setCount={setCount} />
          </>
        );
      }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
