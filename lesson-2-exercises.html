<!doctype html>
<html>
  <head>
    <title>Chatbot</title>
  </head>

  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      // babel is JS compiler
      function LoginFrom() {
        return (
          <>
            <div>
              {' '}
              <input placeholder="Email" />
            </div>
            <div>
              {' '}
              <input placeholder="Password" type="password" />
            </div>
            <button>Login</button>
            <button>Sign up</button>
          </>
        );
      }

      function ProductDetails({ name, price, discountPrice, image }) {
        if (discountPrice) {
          return (
            <div>
              <img src={image} width="80" />
              <p>{name}</p>
              <p>
                <del>Price: ${price}</del>
              </p>
              <p>Discount price: ${discountPrice}</p>
              <button>Add to Cart</button>
            </div>
          );
        }
        return (
          <>
            <p>{name}</p>
            <p>Price: ${price}</p>
            <button>Add to Cart</button>
          </>
        );
      }

      function App() {
        return (
          <>
            <p>Hello, welcome to my website</p>
            <LoginFrom />

            <ProductDetails
              name="Cotton sucks"
              price="10.90"
              discountPrice="5.45"
              image="cotton-socks.png"
            />
            <ProductDetails
              name="Tennis balls"
              price="6.00"
              image="tennis-balls.png"
            />
            <ProductDetails
              name="Plain T-shirt"
              price="7.99"
              discountPrice="8.45"
              image="tennis-balls.png"
            />
          </>
        );
      }

      const container = document.querySelector('.js-container');
      const root = ReactDOM.createRoot(container);
      root.render(<App />);
      // setInterval(() => {
      //   root.render(<p>Current time: {dayjs().format('HH:mm:ss')}</p>);
      // }, 1000);
    </script>
    <script src="react-basics.js"></script>
  </body>
</html>
